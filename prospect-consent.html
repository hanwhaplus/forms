<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>개인정보 수집·이용 동의서</title>
</head>
<body>

<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:#EDEAE3;
  }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:#2B2B2B; color:#fff;
    padding:10px 14px; font-size:12.5px; text-align:center;
  }
  .page-wrap{ padding:16px 14px 8px; }
  .doc{
    position:relative; width:100%; max-width:800px; margin:0 auto;
    box-shadow:0 4px 18px rgba(0,0,0,.15); background:#fff; line-height:0;
  }
  .doc img{ width:100%; display:block; pointer-events:none; -webkit-user-select:none; user-select:none; }

  .txt{
    position:absolute; border:none; background:transparent; outline:none;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:#111;
    padding:0 0 0 4px;
  }
  .txt.small{ text-align:center; }
  .txt.addr{
    resize:none; overflow:hidden; white-space:normal; word-break:break-all;
    line-height:1.15; padding-top:1px;
  }
  .txt.invalid{ background:rgba(255,80,60,.18); }

  .chk{
    position:absolute; cursor:pointer;
  }
  .chk::before{
    content:""; position:absolute; left:-6px; right:-6px; top:-6px; bottom:-6px;
  }
  .chk .box{
    position:absolute; inset:0; border:1.3px solid transparent;
  }
  .chk.on .box{ background:#111; }
  .chk.invalid .box{ box-shadow:0 0 0 2px #C0392B; }
  .chk.disabled{ cursor:not-allowed; }
  .chk.disabled .box{ background:#bbb; opacity:0.6; }
  .chk.disabled.on .box{ background:#888; }

  .sigbox{
    position:absolute; cursor:pointer; background:transparent;
  }
  .sigbox.invalid{ box-shadow:0 0 0 2px #C0392B inset; }
  .sigbox canvas{
    position:absolute; left:0; width:100%; touch-action:none;
    top:50%; height:170%; transform:translateY(-50%);
  }
  .sigbox .hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#B4794A; pointer-events:none;
  }

  .footer-bar{
    position:sticky; bottom:0; z-index:5;
    background:#fff; border-top:1px solid #ddd; padding:14px;
    box-shadow:0 -4px 14px rgba(0,0,0,.08);
    margin-top:8px;
  }
  .footer-bar .inner{ max-width:800px; margin:0 auto; display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tool-btn{
    border:1.5px solid #ccc; background:#fff; border-radius:0; padding:10px 14px; font-size:12.5px; font-weight:600; color:#444; cursor:pointer; white-space:nowrap;
  }
  .save-btn{
    background:#111; color:#fff; border:none; border-radius:0; padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .save-btn:active{ background:#333; }
  .save-btn.outline{
    background:#fff; color:#111; border:1.5px solid #111;
  }
  .save-btn.outline:active{ background:#eee; }
  .footer-bar .right-group{
    margin-left:auto; display:flex; gap:8px;
  }

  .overlay{position:fixed; inset:0; background:rgba(20,15,10,.55); display:none; align-items:center; justify-content:center; z-index:300; padding:20px;}
  .overlay.show{display:flex;}
  .overlay-card{background:#fff; border-radius:14px; padding:28px 24px; max-width:340px; width:100%; text-align:center;}
  .overlay-card .mark{width:56px; height:56px; border-radius:50%; background:#EA5B13; color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px;}
  .overlay-card h3{margin:0 0 8px; font-size:17px;}
  .overlay-card p{margin:0 0 18px; font-size:13px; color:#666; line-height:1.6;}
  .overlay-card .actions{display:flex; gap:8px;}
  .overlay-card button{flex:1; padding:12px; border-radius:0; border:1px solid #ddd; font-size:14px; font-weight:600; cursor:pointer; background:#fff;}
  .overlay-card .primary{background:#111; color:#fff; border-color:#111;}
  .spinner{width:34px; height:34px; border-radius:50%; border:4px solid #eee; border-top-color:#EA5B13; animation:spin .8s linear infinite; margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- 서명 팝업 ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:250; padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:#fff; border-radius:14px; padding:18px; width:100%; max-width:520px;
  }
  .modal-card h3{margin:0 0 12px; font-size:16px;}
  .sig-col{
    border:1.5px dashed #B9B2A4; background:#FCFBF9; touch-action:none; padding:0; position:relative;
    height:160px;
  }
  .sig-col canvas{ width:100%; height:100%; display:block; }
  .modal-actions{display:flex; gap:8px; margin-top:12px;}
  .modal-actions button{
    flex:1; padding:12px; border-radius:0; border:1px solid #ddd; background:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  .modal-actions .primary{background:#111; color:#fff; border-color:#111;}
</style>

  <div style="background:#C0392B; color:#fff; padding:14px; text-align:center; font-weight:bold; font-size:13px;">

const state = { docType:"신규", reqConsent:"동의", optConsent:"동의", channels:new Set(["SMS","TM"]) };

function handleGroupChkClick(el){
  if(el.classList.contains('disabled')) return; // 잠긴 옵션은 클릭 무시
  const group = el.dataset.group, val = el.dataset.val;
  document.querySelectorAll(`.chk[data-group="${group}"]`).forEach(b=>{ b.classList.remove('on'); b.classList.remove('invalid'); });
  el.classList.add('on');
  state[group] = val;
  if(group === 'reqConsent') updateRequiredGating();
  if(group === 'optConsent') updateOptionalGating();
}

/* 필수정보(reqConsent)가 미동의로 바뀌면:
   - 마케팅 수신동의(선택정보/optConsent)도 자동으로 미동의로 전환
   - optConsent 버튼 자체와 그 아래 모든 채널 선택지를 잠금(클릭 불가) */
function updateRequiredGating(){
  const locked = state.reqConsent === '미동의';

  document.getElementById('chk-opt-y').classList.toggle('disabled', locked);
  document.getElementById('chk-opt-n').classList.toggle('disabled', locked);

  if(locked){
    state.optConsent = '미동의';
    document.getElementById('chk-opt-y').classList.remove('on');
    document.getElementById('chk-opt-n').classList.add('on');

    state.channels = new Set(['미동의']);
    document.querySelectorAll('.chk[data-channel]').forEach(b=>{
      b.classList.toggle('on', b.dataset.channel === '미동의');
      b.classList.add('disabled');
    });
  } else {
    document.querySelectorAll('.chk[data-channel]').forEach(b=> b.classList.remove('disabled'));
    updateOptionalGating();
  }
}

/* 선택정보(optConsent)가 미동의면: 이메일, 팩스 채널만 자동으로 회색 처리 + 선택 해제 */
function updateOptionalGating(){
  if(state.reqConsent === '미동의') return; // 필수정보 잠금이 우선 적용된 상태면 그대로 둔다
  const locked = state.optConsent === '미동의';
  const dm = document.getElementById('chk-ch-dm');
  const email = document.getElementById('chk-ch-email');
  const fax = document.getElementById('chk-ch-fax');

  [dm, email, fax].forEach(b=>{
    b.classList.toggle('disabled', locked);
    if(locked) b.classList.remove('on');
  });

  if(locked){
    state.channels.delete('DM');
    state.channels.delete('E-mail');
    state.channels.delete('FAX');
    if(state.channels.size === 0){
      state.channels.add('미동의');
      document.getElementById('chk-ch-na').classList.add('on');
    }
  }
}

function updateChannelGating(){
  updateRequiredGating();
}

function handleChannelChkClick(el){
  if(el.classList.contains('disabled')) return; // 잠긴 채널은 클릭 무시
  const val = el.dataset.channel;
  if(val === '미동의'){
    state.channels = new Set(['미동의']);
    document.querySelectorAll('.chk[data-channel]').forEach(b=>b.classList.remove('on'));
    el.classList.add('on');
  } else {
    state.channels.delete('미동의');
    document.getElementById('chk-ch-na').classList.remove('on');
    if(state.channels.has(val)){ state.channels.delete(val); el.classList.remove('on'); }
    else { state.channels.add(val); el.classList.add('on'); }
    if(state.channels.size === 0){
      state.channels.add('미동의');
      document.getElementById('chk-ch-na').classList.add('on');
    }
  }
}

// 체크박스류는 클릭 시점에 실제 화면의 요소를 찾아 처리(이벤트 위임)한다.

/* ---------------- 서명 (탭하면 팝업에서 얇은 볼펜 느낌으로 서명) ---------------- */

// 최종 합성본에서 원하는 실제 선 굵기(이름/서명 동일 적용, 얇게)
const FINAL_MIN = 1.15, FINAL_MAX = 1.9;
const BP_SENS = 0.55;
const SIG_BOOST = 1.4; // 서명(인) 영역을 살짝 더 크게 배치

function dist(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }

// srcRect 크기의 내용을 areaW x areaH 안에 비율 유지로 맞출 때의 스케일 값
function containScale(srcRect, areaW, areaH){
  return Math.min(areaW / Math.max(srcRect.width,1), areaH / Math.max(srcRect.height,1));
}

// 최종 표시/합성용 캔버스 (박스 위에 얹혀서 미리보기 역할, 직접 그리지 않음)
function makeFinalCanvas(canvasEl){
  const c = canvasEl.getContext('2d');
  const obj = { hasContent:false };
  obj.resize = function(){
    const rect = canvasEl.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvasEl.width = Math.max(Math.round(rect.width * ratio) || 0, 10);
    canvasEl.height = Math.max(Math.round(rect.height * ratio) || 0, 10);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.scale(ratio, ratio);
  };
  obj.clear = function(){ c.clearRect(0,0,canvasEl.width,canvasEl.height); obj.hasContent = false; };
  obj.ctx = c;
  obj.el = canvasEl;
  return obj;
}

const nameBox = document.getElementById('nameBox');
const signBox = document.getElementById('signBox');
const nameHint = document.getElementById('nameHint');
const signHint = document.getElementById('signHint');
const nameFinal = makeFinalCanvas(document.getElementById('nameCanvas'));
const signFinal = makeFinalCanvas(document.getElementById('signCanvas'));
window.addEventListener('resize', ()=>{
  if(!nameFinal.hasContent) nameFinal.resize();
  if(!signFinal.hasContent) signFinal.resize();
});

/* ---- 팝업 (이름 또는 서명, 하나의 패드를 공용으로 사용) ---- */
const padModal = document.getElementById('padModal');
const padModalTitle = document.getElementById('padModalTitle');
const modalPadCanvas = document.getElementById('modalPadCanvas');

function makePad(canvasEl){
  const c = canvasEl.getContext('2d');
  const pad = { hasInk:false, drawing:false, lastPos:null, lastTime:0, currentWidth:2, minW:FINAL_MIN, maxW:FINAL_MAX };

  function resize(){
    const rect = canvasEl.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvasEl.width = Math.max(Math.round(rect.width * ratio) || 0, 10);
    canvasEl.height = Math.max(Math.round(rect.height * ratio) || 0, 10);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.scale(ratio, ratio);
  }
  function getPos(e){
    const rect = canvasEl.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function strokeTo(pos, ts){
    const dt = Math.max(ts - pad.lastTime, 1);
    const d = dist(pad.lastPos, pos);
    const speed = d/dt;
    const target = Math.max(pad.minW, pad.maxW - speed*BP_SENS);
    pad.currentWidth = pad.currentWidth*0.65 + target*0.35;
    c.lineCap='round'; c.lineJoin='round';
    c.strokeStyle = '#111'; c.globalAlpha = 0.9; c.lineWidth = pad.currentWidth;
    c.beginPath(); c.moveTo(pad.lastPos.x,pad.lastPos.y); c.lineTo(pos.x,pos.y); c.stroke();
    c.globalAlpha = 1;
    pad.lastPos = pos; pad.lastTime = ts;
  }
  function start(e){
    e.preventDefault();
    pad.drawing = true; pad.hasInk = true;
    pad.lastPos = getPos(e); pad.lastTime = e.timeStamp; pad.currentWidth = pad.maxW;
    strokeTo(pad.lastPos, e.timeStamp);
  }
  function move(e){ if(!pad.drawing) return; e.preventDefault(); strokeTo(getPos(e), e.timeStamp); }
  function end(){ pad.drawing = false; }

  canvasEl.addEventListener('pointerdown', start);
  canvasEl.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvasEl.addEventListener('pointercancel', end);

  pad.resize = resize;
  pad.clear = ()=>{ c.clearRect(0,0,canvasEl.width,canvasEl.height); pad.hasInk = false; };
  pad.setStrokeRange = (min, max)=>{ pad.minW = min; pad.maxW = max; };
  pad.ctx = c;
  return pad;
}

const modalPad = makePad(modalPadCanvas);
let padTarget = null; // 'name' | 'sign'

function openPadModal(target){
  padTarget = target;
  padModalTitle.textContent = target === 'name' ? '이름을 적어주세요' : '서명(인)을 적어주세요';
  padModal.classList.add('show');
  setTimeout(()=>{
    modalPad.resize();
    modalPad.clear();

    // 최종 배치 시 얼마나 확대/축소되는지 미리 계산해서 동일한 두께로 보이도록 보정
    const finalObj = target === 'name' ? nameFinal : signFinal;
    finalObj.resize();
    const areaRect = finalObj.el.getBoundingClientRect();
    const boost = target === 'sign' ? SIG_BOOST : 1;
    const pRect = modalPadCanvas.getBoundingClientRect();
    const scale = containScale(pRect, areaRect.width, areaRect.height) * boost;
    modalPad.setStrokeRange(FINAL_MIN / scale, FINAL_MAX / scale);
  }, 30);
}
document.addEventListener('click', function(e){
  if(e.target.closest('#nameBox')){ openPadModal('name'); return; }
  if(e.target.closest('#signBox')){ openPadModal('sign'); return; }
});

document.getElementById('modalClearBtn').addEventListener('click', ()=>{
  modalPad.clear();
});
document.getElementById('modalDoneBtn').addEventListener('click', ()=>{
  try{
    if(modalPad.hasInk){
      const finalObj = padTarget === 'name' ? nameFinal : signFinal;
      const box = padTarget === 'name' ? nameBox : signBox;
      const hint = padTarget === 'name' ? nameHint : signHint;
      const boost = padTarget === 'sign' ? SIG_BOOST : 1;

      finalObj.resize();
      finalObj.ctx.clearRect(0,0,finalObj.el.width,finalObj.el.height);
      const areaRect = finalObj.el.getBoundingClientRect();
      const padRect = modalPadCanvas.getBoundingClientRect();

      if(areaRect.width > 0 && areaRect.height > 0 && padRect.width > 0 && padRect.height > 0){
        const scale = containScale(padRect, areaRect.width, areaRect.height) * boost;
        const drawW = padRect.width * scale;
        const drawH = padRect.height * scale;
        if(isFinite(drawW) && isFinite(drawH) && drawW > 0 && drawH > 0){
          const dx = (areaRect.width - drawW) / 2;
          const dy = (areaRect.height - drawH) / 2;
          finalObj.ctx.drawImage(modalPadCanvas, dx, dy, drawW, drawH);
          finalObj.hasContent = true;
          hint.style.display = 'none';
          box.classList.remove('invalid');
        } else {
          console.warn('서명 배치 크기 계산 실패 - 화면 레이아웃을 확인해 주세요.', {drawW, drawH});
        }
      } else {
        console.warn('서명 영역 크기를 읽지 못했습니다 (areaRect/padRect가 0).', {areaRect, padRect});
      }
    }
  } catch(err){
    console.error('서명/이름 적용 중 오류:', err);
    showMessage('오류', '작성한 내용을 적용하는 중 문제가 발생했습니다:\n\n' + (err && err.message ? err.message : err) + '\n\n다시 시도해 주세요.');
  } finally {
    padModal.classList.remove('show');
  }
});
padModal.addEventListener('click', (e)=>{ if(e.target === padModal) padModal.classList.remove('show'); });

document.getElementById('clearSigBtn').addEventListener('click', ()=>{
  nameFinal.clear();
  signFinal.clear();
  nameHint.style.display = 'flex';
  signHint.style.display = 'flex';
});

document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  showMessage('전체 지우기', '입력하신 모든 내용(글자, 체크, 이름/서명)을 지울까요?', {
    showCancel: true,
    onConfirm: resetForm
  });
});

function validate(){
  let ok = true;
  const name = document.getElementById('name').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  document.getElementById('name').classList.remove('invalid');
  document.getElementById('mobile').classList.remove('invalid');
  signBox.classList.remove('invalid');

  if(!name){ document.getElementById('name').classList.add('invalid'); ok = false; }
  if(!mobile){ document.getElementById('mobile').classList.add('invalid'); ok = false; }
  if(!signFinal.hasContent){ signBox.classList.add('invalid'); ok = false; }
  return ok;
}

/* ---------------- PDF 저장 (화면 그대로 캡처, 외부 라이브러리 없이 직접 PDF 생성) ---------------- */

// JPEG 이미지 한 장을 담은 최소 구성 PDF 파일을 순수 JS로 직접 생성 (외부 스크립트 불필요)
function buildPdfFromJpeg(jpegBytes, imgWpx, imgHpx, pageWpt, pageHpt){
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [];
  let offset = 0;

  function push(data){
    const bytes = (typeof data === 'string') ? enc.encode(data) : data;
    chunks.push(bytes);
    offset += bytes.length;
  }
  function beginObj(num){ offsets[num] = offset; push(num + ' 0 obj\n'); }
  function endObj(){ push('endobj\n'); }
  function pad10(n){ return String(n).padStart(10, '0'); }

  push('%PDF-1.4\n');
  push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])); // 바이너리 파일임을 알리는 관례적 주석

  beginObj(1);
  push('<< /Type /Catalog /Pages 2 0 R >>\n');
  endObj();

  beginObj(2);
  push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\n');
  endObj();

  beginObj(3);
  push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWpt} ${pageHpt}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\n`);
  endObj();

  const contentBytes = enc.encode(`q ${pageWpt} 0 0 ${pageHpt} 0 0 cm /Im0 Do Q`);
  beginObj(4);
  push(`<< /Length ${contentBytes.length} >>\nstream\n`);
  push(contentBytes);
  push('\nendstream\n');
  endObj();

  beginObj(5);
  push(`<< /Type /XObject /Subtype /Image /Width ${imgWpx} /Height ${imgHpx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
  push(jpegBytes);
  push('\nendstream\n');
  endObj();

  const xrefOffset = offset;
  push('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++) push(pad10(offsets[i]) + ' 00000 n \n');
  push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF');

  let total = 0;
  for(const c of chunks) total += c.length;
  const result = new Uint8Array(total);
  let pos = 0;
  for(const c of chunks){ result.set(c, pos); pos += c.length; }
  return result;
}

function dataUrlToBytes(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function downloadBytes(bytes, filename){
  const blob = new Blob([bytes], { type:'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

async function buildPdfBytesAndName(){
  const docEl = document.getElementById('doc');
  const rect = docEl.getBoundingClientRect();

  // 텍스트/체크 오버레이 + 서명을 배경 이미지 원본 해상도(1654x2339)에 합성
  const NATIVE_W = 1654, NATIVE_H = 2339;
  const merged = document.createElement('canvas');
  merged.width = NATIVE_W; merged.height = NATIVE_H;
  const mctx = merged.getContext('2d');

  await new Promise((res, rej)=>{
    const bg = new Image();
    const timer = setTimeout(()=>{
      rej(new Error('배경 이미지를 불러오는 데 시간이 너무 오래 걸립니다. 이 게시판/플랫폼이 긴 이미지(data URL) 코드를 잘라내거나 차단했을 수 있습니다.'));
    }, 8000);
    bg.onload = ()=>{ clearTimeout(timer); mctx.drawImage(bg,0,0,NATIVE_W,NATIVE_H); res(); };
    bg.onerror = ()=>{ clearTimeout(timer); rej(new Error('배경 이미지를 불러오지 못했습니다. 이 게시판/플랫폼이 이미지 코드(base64)를 잘라내거나 변형했을 수 있습니다.')); };
    const src = document.getElementById('bgImage').src;
    if(!src || src.length < 1000){
      clearTimeout(timer);
      rej(new Error('배경 이미지 데이터가 비어있거나 잘렸습니다. 이 HTML을 게시판에 붙여넣는 과정에서 코드 일부가 잘렸을 가능성이 높습니다.'));
      return;
    }
    bg.src = src;
  });

  const scaleX = NATIVE_W / rect.width;
  const scaleY = NATIVE_H / rect.height;

  mctx.fillStyle = '#111';
  mctx.textBaseline = 'middle';

  function wrapTextToLines(text, maxWidth, maxLines){
    const lines = [];
    let line = '';
    for(const ch of text){
      const test = line + ch;
      if(mctx.measureText(test).width > maxWidth && line.length > 0){
        lines.push(line);
        line = ch;
        if(lines.length >= maxLines - 1) {
          // 남은 글자는 마지막 줄에 이어붙임 (그 이상은 잘림)
          line = ch;
        }
      } else {
        line = test;
      }
      if(lines.length >= maxLines) break;
    }
    if(lines.length < maxLines) lines.push(line);
    return lines.slice(0, maxLines);
  }

  document.querySelectorAll('.txt').forEach(inp=>{
    const val = inp.value.trim();
    if(!val) return;
    const r = inp.getBoundingClientRect();
    const padLeft = (parseFloat(getComputedStyle(inp).paddingLeft) || 0) * scaleX;
    const x = (r.left - rect.left) * scaleX + padLeft;
    const fontPx = parseFloat(getComputedStyle(inp).fontSize) * scaleX;
    mctx.font = `${fontPx}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;
    mctx.textAlign = inp.classList.contains('small') ? 'center' : 'left';

    if(inp.classList.contains('addr')){
      // 주소는 칸 폭에 맞춰 최대 2줄까지 자동 줄바꿈
      const maxWidth = (r.width * scaleX) - padLeft - 4;
      const lines = wrapTextToLines(val, maxWidth, 2);
      const lineH = (parseFloat(getComputedStyle(inp).lineHeight) || fontPx*1.2) * scaleY;
      const totalH = lineH * lines.length;
      const startY = (r.top - rect.top) * scaleY + ((r.height*scaleY) - totalH) / 2 + lineH/2;
      lines.forEach((ln, i)=>{
        mctx.fillText(ln, x, startY + lineH * i);
      });
      return;
    }

    const y = (r.top - rect.top) * scaleY + (r.height*scaleY)/2;
    const drawX = inp.classList.contains('small') ? x - padLeft + (r.width*scaleX)/2 : x;
    mctx.fillText(val, drawX, y);
  });

  document.querySelectorAll('.chk.on').forEach(chk=>{
    const r = chk.getBoundingClientRect();
    const x = (r.left - rect.left) * scaleX;
    const y = (r.top - rect.top) * scaleY;
    const w = r.width * scaleX, h = r.height * scaleY;
    mctx.fillStyle = '#111';
    mctx.fillRect(x, y, w, h);
  });

  // 이름/서명 캔버스 합성 (각각 위아래로 살짝 넘치는 확장 영역까지 그대로 반영)
  [nameFinal, signFinal].forEach(finalObj=>{
    const sr = finalObj.el.getBoundingClientRect();
    const sx = (sr.left - rect.left) * scaleX;
    const sy = (sr.top - rect.top) * scaleY;
    const sw = sr.width * scaleX, sh = sr.height * scaleY;
    mctx.drawImage(finalObj.el, sx, sy, sw, sh);
  });

  const jpegDataUrl = merged.toDataURL('image/jpeg', 0.95);
  const jpegBytes = dataUrlToBytes(jpegDataUrl);
  const pdfBytes = buildPdfFromJpeg(jpegBytes, NATIVE_W, NATIVE_H, 595, 842);

  const name = document.getElementById('name').value.trim() || '고객';
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  return { bytes: pdfBytes, filename: `가망고객_개인정보동의서_${name}_${stamp}.pdf` };
}

/* "PDF로 저장" 버튼용: PDF를 만들어 바로 다운로드 폴더에 저장 */
async function generatePdf(){
  const { bytes, filename } = await buildPdfBytesAndName();
  downloadBytes(bytes, filename);
}

/* =========================================================
   자동 이메일 전송 설정 (Google Apps Script 웹앱 방식 - 완전 무료, 첨부파일 제한 없음)
   1) Apps Script 프로젝트를 만들고 아래 URL을 배포해서 받은 "웹 앱 URL"을 여기에 붙여넣으세요.
      (별도로 전달한 Code.gs 파일의 안내를 따라 배포하시면 됩니다)
   2) URL을 넣으면 "PDF로 내보내기" 클릭 시 공유 창 없이 바로
      pluspb@hanwha.com으로 PDF 첨부 이메일이 자동 발송됩니다.
   ========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwY14fTgvNper60RvrK132pXydYMuD9ayU7yRJ9MR7ZNAET0gBEHXRfHJgw5eHn1Ukm/exec";

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const result = reader.result; // "data:application/pdf;base64,XXXX..." 형태
      resolve(result.split(',')[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* "제출하기" 버튼용: PDF를 만들어 자동으로 pluspb@hanwha.com에 전송한다.
   전송에 실패하면 예외를 던지며, 클릭 핸들러 쪽에서 "PDF로 저장 후 개별 전달" 안내를 보여준다. */
async function submitConsent(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"){
    throw new Error('전송 설정이 되어 있지 않습니다.');
  }

  const { bytes, filename } = await buildPdfBytesAndName();
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const name = document.getElementById('name').value.trim() || '고객';
  const phone = document.getElementById('mobile').value.trim() || document.getElementById('phone').value.trim() || '';
  const base64 = await blobToBase64(blob);

  const fd = new FormData();
  fd.append('name', name);
  fd.append('phone', phone);
  fd.append('filename', filename);
  fd.append('pdfBase64', base64);

  /* Apps Script 웹앱은 CORS 프리플라이트를 지원하지 않아 mode:'no-cors'로 보냄.
     이 모드에서는 응답 내용을 읽을 수 없어 서버 안쪽 처리 결과까지는 확인이 안 되지만,
     네트워크 전송 자체가 오류 없이 끝나면 정상적으로 서버에 도달한 것으로 처리한다.
     (오프라인이거나 URL이 잘못된 경우 등 네트워크 단계 오류는 여기서 catch되어 실패로 처리된다) */
  await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: fd });
}

function showOverlayLoading(){
  document.getElementById('ovBody').innerHTML = `
    <div class="spinner"></div>
    <h3>PDF 생성 중입니다</h3>
    <p>잠시만 기다려 주세요.</p>`;
  document.getElementById('overlay').classList.add('show');
}
function showOverlayDone(){
  document.getElementById('ovBody').innerHTML = `
    <div class="mark">✓</div>
    <h3>저장 완료</h3>
    <p>동의서 PDF가 다운로드되었습니다.<br>다음 고객을 위해 화면을 초기화할까요?</p>
    <div class="actions">
      <button id="closeOv">닫기</button>
      <button class="primary" id="nextCustomer">다음 고객</button>
    </div>`;
  document.getElementById('closeOv').addEventListener('click', ()=> document.getElementById('overlay').classList.remove('show'));
  document.getElementById('nextCustomer').addEventListener('click', ()=>{
    document.getElementById('overlay').classList.remove('show');
    resetForm();
  });
}
function resetForm(){
  document.querySelectorAll('.txt').forEach(i=>i.value='');
  document.querySelectorAll('.chk').forEach(b=>{ b.classList.remove('on'); b.classList.remove('disabled'); });
  document.getElementById('chk-doc-new').classList.add('on');
  document.getElementById('chk-req-y').classList.add('on');
  document.getElementById('chk-opt-y').classList.add('on');
  document.getElementById('chk-ch-sms').classList.add('on');
  document.getElementById('chk-ch-tm').classList.add('on');
  state.docType='신규'; state.reqConsent='동의'; state.optConsent='동의';
  state.channels = new Set(['SMS', 'TM']);
  nameFinal.clear();
  signFinal.clear();
  nameHint.style.display='flex';
  signHint.style.display='flex';
  const d = new Date();
  document.getElementById('yearInput').value = d.getFullYear();
  document.getElementById('monthInput').value = d.getMonth()+1;
  document.getElementById('dayInput').value = d.getDate();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  if(!validate()){
    showMessage('확인 필요', '성명, 휴대폰번호, 서명(탭하여 작성)을 확인해 주세요.');
    return;
  }
  showOverlayLoading();
  try{
    await generatePdf();
    showOverlayDone();
  }catch(err){
    document.getElementById('overlay').classList.remove('show');
    showMessage('PDF 생성 오류', 'PDF 생성 중 오류가 발생했습니다:\n\n' + (err && err.message ? err.message : err) + '\n\n다시 시도해 주세요.');
    console.error(err);
  }
});

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  if(!validate()){
    showMessage('확인 필요', '성명, 휴대폰번호, 서명(탭하여 작성)을 확인해 주세요.');
    return;
  }
  showOverlayLoading();
  try{
    await submitConsent();
    document.getElementById('overlay').classList.remove('show');
    showMessage('제출 완료', '제출이 완료되었습니다. 감사합니다.');
  }catch(err){
    document.getElementById('overlay').classList.remove('show');
    showMessage(
      '제출 실패',
      '제출 처리 중 문제가 발생했습니다.\n\n' +
      '"PDF로 저장" 버튼으로 PDF를 저장하신 후, 담당자에게 개별적으로 전달해 주세요.'
    );
    console.error(err);
  }
});
}

/* 게시판 등에 삽입될 때 스크립트 실행 시점이 요소 렌더링보다 앞설 수 있어,
   필요한 요소가 모두 존재할 때까지 재시도 후 초기화한다. */
(function waitAndInit(triesLeft){
  var ready = document.getElementById("doc") && document.getElementById("nameHint") &&
    document.getElementById("signHint") && document.getElementById("padModal") &&
    document.getElementById("modalPadCanvas");
  if(ready){
    initConsentForm();
  } else if(triesLeft > 0){
    setTimeout(function(){ waitAndInit(triesLeft - 1); }, 100);
  } else {
    console.error("가망고객 동의서: 필요한 화면 요소를 찾지 못해 초기화하지 못했습니다.");
  }
})(50);
