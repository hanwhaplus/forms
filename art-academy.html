<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초대장 · PLUS Art Academy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000;--deep:#101010;--w:#fff;--mute:#9B9B9B;
  --line:rgba(255,255,255,.18);
  --ease:cubic-bezier(.16,1,.3,1);
  --kr:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
  --en:'Archivo',var(--kr);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000}
body{background:#000;color:var(--w);font-family:var(--kr);letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;letter-spacing:inherit;border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.ic{position:absolute;left:0;top:0;width:100%;height:100vh;height:100dvh;z-index:0;opacity:0;transition:opacity 1.1s ease}
.open .ic{opacity:1}
.ign{position:absolute;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:0;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.icv{position:absolute;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:0;pointer-events:none;
  background:radial-gradient(140% 84% at 50% 38%,transparent 52%,rgba(0,0,0,.38) 88%,rgba(0,0,0,.6) 100%),
             linear-gradient(to bottom,transparent 58%,rgba(0,0,0,.82) 84%,rgba(0,0,0,.95) 100%)}
.card{touch-action:pan-y;
  max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#000;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
/* 봉인 */
.seal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20}
.leaf{position:absolute;left:0;right:0;height:50%;background:var(--deep);
  transition:transform 1.05s var(--ease)}
.leaf.up{top:0;border-bottom:1px solid var(--line)}
.leaf.dn{bottom:0}
.open .leaf.up{transform:translateY(-100%)}
.open .leaf.dn{transform:translateY(100%)}
.sealbox{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;transition:opacity .4s ease}
.open .sealbox{opacity:0;pointer-events:none}
.sealbox .m{font-family:var(--en);font-weight:600;font-size:14px;letter-spacing:.03em;
  transform:translateY(-104px)}
.sealbox .h{position:absolute;left:34px;right:34px;height:1px;background:var(--line)}
.sealbox .slogo{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));width:224px;height:auto;opacity:.9}
.sealbox .o{position:absolute;top:50%;transform:translateY(-26px);display:flex;flex-direction:column;align-items:center;gap:12px;
  font-size:13.5px;color:#CFCFCF}
.ring{width:52px;height:52px;border:1px solid var(--line);border-radius:50%;background:var(--deep);
  display:grid;place-items:center;animation:breathe 3.4s ease-in-out infinite}
.ring:after{content:'';width:7px;height:7px;border:solid #fff;border-width:0 1px 1px 0;
  transform:rotate(45deg) translate(-1px,-1px)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}

/* 본문 */
.card:not(.open) .inner{display:none}
.inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:34px 26px 26px;opacity:0;
  transition:opacity .5s ease .45s}
.open .inner{opacity:1}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top .m{font-family:var(--en);font-weight:600;font-size:13px;letter-spacing:.02em}

.big{margin:auto 0;padding:26px 0}
.big h1{margin:0;font-family:var(--en);font-weight:600;font-size:clamp(66px,20vw,84px);
  line-height:.85;letter-spacing:-.045em}
.big h1 span{display:block;clip-path:inset(0 100% 0 0)}
.open .big h1 span{animation:wipe .9s var(--ease) .5s forwards}
.open .big h1 span:nth-child(2){animation-delay:.63s;margin-left:.4em}
@keyframes wipe{to{clip-path:inset(0 -12% 0 0)}}
.big .sub{margin:24px 0 0;font-size:17px;font-weight:600;letter-spacing:-.035em}
.big .by{margin:9px 0 0;font-size:13.5px;color:#BEBEBE;line-height:1.6}

.to b{font-weight:600;color:#fff}
.meta{margin:0;border-top:1px solid var(--line)}
.meta div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.meta span:first-child{width:42px;flex:none;color:var(--mute);font-size:12.5px}
.acts{display:flex;gap:9px;margin-top:24px}
.acts a,.acts button{flex:1;height:52px;border-radius:3px;font-size:14.5px;font-weight:600;
  display:grid;place-items:center;text-decoration:none;transition:.18s}
.ghost{border:1px solid rgba(255,255,255,.34);color:#fff}
.acts a.solid,.acts button.solid{background:#fff;color:#1C1C1C;
  -webkit-text-fill-color:#1C1C1C;border:1px solid #fff}
.acts button:active,.acts a:active{transform:scale(.985)}

/* 상세 보기 오버레이 */
.det{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;background:#000}
.det iframe{width:100%;height:100%;border:0;display:block}
.detback{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:95;
  height:38px;padding:0 15px;border-radius:100px;font-size:13px;font-weight:600;
  background:rgba(20,20,20,.72);color:#fff;border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.001s!important}
  .big h1 span{clip-path:none!important}}
</style>
</head>

    cardEl.addEventListener('pointerdown',function(e){
      if(e.target.closest('button,a,label'))return;
      drag=true;moved=0;lx=e.clientX;ly=e.clientY;
    });
    cardEl.addEventListener('pointermove',function(e){
      if(!drag)return;
      var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
      moved+=Math.abs(dx)+Math.abs(dy);
      base+=dx*.0052;rxu+=dy*.0032;vb=dx*.0052;vx=dy*.0032;
      if(base>1.15)base=1.15; if(base<-1.15)base=-1.15;
    });
    addEventListener('pointerup',function(){if(drag&&moved<6)burst=.30;drag=false});
    cardEl.addEventListener('pointercancel',function(){drag=false});
  }


  /* 상세 보기 — 파일이 나란히 있으면 그 파일로, 아니면 내장본으로 */
  var DETAIL='the-art-seminar.html';
  var det=document.getElementById('det'),frame=document.getElementById('detFrame'),dsy=0;
  document.getElementById('detail').addEventListener('click',function(e){
    e.preventDefault();
    if(!frame.src) frame.src=DETAIL;
    dsy=scrollY; det.hidden=false;
    document.body.style.cssText='position:fixed;left:0;right:0;top:'+(-dsy)+'px';
  });
  document.getElementById('detBack').addEventListener('click',function(){
    det.hidden=true; document.body.style.cssText=''; scrollTo(0,dsy);
  });
  addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!det.hidden) document.getElementById('detBack').click();
  });

})();
</script>
</body>
